    </circle>

    <!-- Group 2: Mid-ground Shifting Particles -->
    <circle cx="150" cy="120" r="3" fill="url(#node-grad)" opacity="0.6">
      <animate attributeName="cx" values="150;175;125;150" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;140;100;120" dur="16s" repeatCount="indefinite" />
