<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Import Google Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .term-text {
        font-family: 'JetBrains Mono', monospace;
      }
      .sans-text {
        font-family: 'Inter', sans-serif;
      }
      .glow-node {
        filter: url(#glow);
        animation: pulse 3s ease-in-out infinite;
      }
      .glow-text {
        filter: url(#text-glow);
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes signal-flow {
        to {
          stroke-dashoffset: -20;
        }
      }
      
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      
      .flow-path {
        stroke-dasharray: 5, 5;
        animation: signal-flow 1s linear infinite;
      }

      /* Out-of-phase pulsing nodes */
      .glow-node-1 {
        filter: url(#glow);
        animation: pulse-1 4s ease-in-out infinite;
      }
      .glow-node-2 {
        filter: url(#glow);
        animation: pulse-2 4s ease-in-out infinite;
        animation-delay: 1.3s;
      }
      .glow-node-3 {
        filter: url(#glow);
        animation: pulse-3 4s ease-in-out infinite;
        animation-delay: 2.6s;
      }

      @keyframes pulse-1 { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes pulse-2 { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes pulse-3 { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    </style>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#090A0F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06070A" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="center-flare" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="15%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="85%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Grid pattern for background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7C3AED" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#090A0F"/>
  <rect width="100%" height="100%" fill="url(#bg-glow)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Full-Screen Glowing Firefly Particles Backdrop (Rich 40-Particle Depth Field) -->
  <g>
    <!-- Group 1: Shifting & Size Pulsing Foreground Fireflies (Larger, glowing) -->
    <circle cx="250" cy="120" r="4" fill="url(#node-grad)" class="glow-node-1">
      <animate attributeName="cx" values="250;285;225;250" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;145;95;120" dur="22s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;5.5;3" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.95;0.2;0.3" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="140" r="5" fill="url(#node-grad)" class="glow-node-2">
