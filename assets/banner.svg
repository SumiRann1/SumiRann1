      <animate attributeName="cy" values="140;115;165;140" dur="24s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;6.5;3.5" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1.0;0.3;0.4" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="130" r="3.5" fill="url(#node-grad)" class="glow-node-3">
      <animate attributeName="cx" values="950;985;915;950" dur="19s" repeatCount="indefinite" />
      <animate attributeName="cy" values="130;110;155;130" dur="23s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;5.0;2.5" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.35;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="260" r="5" fill="url(#node-grad)" class="glow-node-1">
      <animate attributeName="cx" values="180;210;150;180" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;235;285;260" dur="22s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;6.0;3.5" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;1.0;0.25;0.35" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="280" r="4.5" fill="url(#node-grad)" class="glow-node-2">
