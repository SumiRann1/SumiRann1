    <circle cx="750" cy="360" r="2.5" fill="url(#node-grad)" opacity="0.5">
      <animate attributeName="cx" values="750;765;735;750" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="360;375;345;360" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1180" cy="440" r="3" fill="url(#node-grad)" opacity="0.6">
      <animate attributeName="cx" values="1180;1160;1200;1180" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="440;420;460;440" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="80" r="3" fill="url(#node-grad)" opacity="0.6">
      <animate attributeName="cx" values="800;780;820;800" dur="19s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;95;65;80" dur="22s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Group 3: Distant Background Micro-Stars (Tiny, slow drift, faint) -->
    <circle cx="300" cy="80" r="1.5" fill="#C084FC" opacity="0.3">
