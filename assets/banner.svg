    </circle>
    <circle cx="850" cy="270" r="5.5" fill="url(#node-grad)" class="glow-node-3">
      <animate attributeName="cx" values="850;820;880;850" dur="17s" repeatCount="indefinite" />
      <animate attributeName="cy" values="270;295;245;270" dur="21s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;7.0;4" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1.0;0.3;0.4" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="380" r="5" fill="url(#node-grad)" class="glow-node-1">
      <animate attributeName="cx" values="100;130;70;100" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="380;355;405;380" dur="23s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;6.2;3.5" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.95;0.25;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="580" cy="430" r="4.5" fill="url(#node-grad)" class="glow-node-2">
