      <rect x="40" y="0" width="11" height="11" rx="2.2" opacity="0.3" />
      <rect x="55" y="0" width="11" height="11" rx="2.2" opacity="0.9" />
      <rect x="70" y="0" width="11" height="11" rx="2.2" opacity="0.5" />
