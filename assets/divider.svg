<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');
      .divider-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
      }
      .glow-filter {
        filter: url(#glow);
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="65%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glowing background lines -->
  <line x1="150" y1="30" x2="1050" y2="30" stroke="url(#line-fade)" stroke-width="2.5" class="glow-filter"/>
  <ellipse cx="600" cy="30" rx="50" ry="5" fill="url(#center-glow)"/>

  <!-- Center Hexagon Badge -->
  <g transform="translate(600, 30)">
    <path d="M 0 -16 L 14 -8 L 14 8 L 0 16 L -14 8 L -14 -8 Z" fill="#090A0F" stroke="#A855F7" stroke-width="1.8" class="glow-filter"/>
    <text class="divider-text" x="0" y="3.5" fill="#C084FC" font-size="10" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Left/Right accent dots -->
  <circle cx="550" cy="30" r="3" fill="#A855F7" class="glow-filter"/>
  <circle cx="530" cy="30" r="1.5" fill="#7C3AED" opacity="0.6"/>
  <circle cx="510" cy="30" r="1" fill="#7C3AED" opacity="0.3"/>
  
  <circle cx="650" cy="30" r="3" fill="#A855F7" class="glow-filter"/>
  <circle cx="670" cy="30" r="1.5" fill="#7C3AED" opacity="0.6"/>
  <circle cx="690" cy="30" r="1" fill="#7C3AED" opacity="0.3"/>
</svg>